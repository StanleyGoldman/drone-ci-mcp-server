# Internet-facing deployment with Caddy reverse proxy.
# Caddy handles TLS (auto-HTTPS via Let's Encrypt) and optional auth.
# Use this when you want Claude on claude.ai to reach your MCP server.
#
# Prerequisites:
#   1. Your domain's DNS A record points to this host
#   2. Ports 80 and 443 are open on your firewall/router
#
# Usage:
#   cp .env.example .env   # fill in all variables including MCP_HOSTNAME
#   docker compose -f docker-compose.caddy.yml up -d

services:
  drone-mcp:
    build: .
    image: drone-ci-mcp:latest
    environment:
      DRONE_SERVER: ${DRONE_SERVER}
      DRONE_TOKEN: ${DRONE_TOKEN:-}
      DRONE_TOKEN_FILE: ${DRONE_TOKEN_FILE:-}
      MCP_PORT: 8080
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      MCP_AUTH_TOKEN_FILE: ${MCP_AUTH_TOKEN_FILE:-}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-}
      OAUTH_CLIENT_SECRET_FILE: ${OAUTH_CLIENT_SECRET_FILE:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      MCP_HOSTNAME: ${MCP_HOSTNAME}
    depends_on:
      - drone-mcp
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
